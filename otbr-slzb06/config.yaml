name: "OTBR TCP (SLZB-06)"
version: "2026.2.5.15"
slug: "otbr_tcp_slzb06"
description: "Robust OpenThread Border Router for TCP-connected adapters (SLZB-06/SMLIGHT)"
url: "https://github.com/flarn/ha-otbr-slzb06-app"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: true
host_network: true
full_access: true
devices:
  - /dev/net/tun
map:
  - config:rw
options:
  rcp_host: ""
  rcp_port: 6638
  rcp_baudrate: 460800
  backbone_interface: "eth0"
  log_level: info
schema:
  rcp_host: str
  rcp_port: port
  rcp_baudrate: int
  backbone_interface: str
  log_level: list(debug|info|notice|warning|error)
ports:
  8080/tcp: 8080
